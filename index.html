<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Judgement of Paris</title>

  <style>
    :root {
      --bg: #070b14;
      --bg-2: #0d1324;
      --bg-3: #151c30;
      --panel: rgba(13, 19, 36, 0.92);
      --panel-2: rgba(20, 28, 49, 0.94);
      --accent: #d8b35a;
      --accent-hover: #efcb78;
      --accent-soft: rgba(216, 179, 90, 0.18);
      --text: #f8f6ef;
      --muted: #c7cede;
      --soft-text: #e7dfcb;
      --line: rgba(216, 179, 90, 0.20);
      --line-strong: rgba(216, 179, 90, 0.38);
      --shadow: 0 28px 90px rgba(0, 0, 0, 0.55);
      --glow: 0 0 24px rgba(216, 179, 90, 0.16);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
      background:
        radial-gradient(circle at top, rgba(255, 235, 170, 0.10), transparent 24%),
        radial-gradient(circle at 50% -10%, rgba(216, 179, 90, 0.14), transparent 32%),
        linear-gradient(180deg, #1a223d 0%, var(--bg-2) 18%, var(--bg) 100%);
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.18;
      background:
        radial-gradient(circle at 20% 18%, rgba(255,255,255,0.05) 0 2px, transparent 3px),
        radial-gradient(circle at 80% 12%, rgba(255,255,255,0.04) 0 1.5px, transparent 3px),
        radial-gradient(circle at 65% 28%, rgba(255,255,255,0.05) 0 1.2px, transparent 2.6px),
        radial-gradient(circle at 35% 35%, rgba(255,255,255,0.04) 0 1.5px, transparent 2.8px);
    }

    .page {
      max-width: 980px;
      margin: 0 auto;
    }

    .game {
      width: 100%;
      background:
        linear-gradient(180deg, rgba(24, 32, 56, 0.96), rgba(10, 14, 26, 0.96));
      backdrop-filter: blur(10px);
      border-radius: 30px;
      padding: 42px;
      box-shadow: var(--shadow);
      border: 1px solid var(--line);
      overflow: hidden;
      position: relative;
    }

    .game::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at top center, rgba(216, 179, 90, 0.12), transparent 30%),
        linear-gradient(135deg, rgba(255, 235, 180, 0.05), transparent 36%);
    }

    .game::after {
      content: "❦";
      position: absolute;
      top: 18px;
      right: 22px;
      font-size: 26px;
      color: rgba(216, 179, 90, 0.28);
      text-shadow: 0 0 12px rgba(216, 179, 90, 0.14);
      pointer-events: none;
    }

    .progress {
      display: flex;
      gap: 10px;
      margin-bottom: 28px;
      position: relative;
      z-index: 1;
    }

    .progress .dot {
      flex: 1;
      height: 8px;
      border-radius: 999px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(216, 179, 90, 0.08);
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    .progress .dot.active {
      background: linear-gradient(90deg, #b88b2d, var(--accent), #f1d489);
      box-shadow: 0 0 12px rgba(216, 179, 90, 0.24);
    }

    .step-label {
      font-size: 12px;
      letter-spacing: 2.2px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 14px;
      position: relative;
      z-index: 1;
    }

    .intro-title,
    .ending h1 {
      font-size: clamp(2rem, 5vw, 3.2rem);
      line-height: 1.1;
      margin-bottom: 18px;
      position: relative;
      z-index: 1;
      color: var(--text);
      text-shadow: 0 2px 18px rgba(216, 179, 90, 0.12);
    }

    .intro-title::after {
      content: "◦ ◦ ◦";
      display: block;
      margin-top: 14px;
      font-size: 0.95rem;
      letter-spacing: 0.35rem;
      color: rgba(216, 179, 90, 0.50);
      text-shadow: none;
    }

    .intro-story {
      background:
        linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 24px;
      line-height: 1.95;
      color: var(--muted);
      font-size: 1.02rem;
      margin-bottom: 24px;
      position: relative;
      z-index: 1;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
    }

    .intro-story::before {
      content: "🍎";
      position: absolute;
      top: 14px;
      right: 16px;
      font-size: 1.1rem;
      opacity: 0.18;
      pointer-events: none;
    }

    .scenario {
      font-size: clamp(1.35rem, 3vw, 1.8rem);
      line-height: 1.5;
      margin-bottom: 18px;
      font-weight: 700;
      position: relative;
      z-index: 1;
      color: var(--text);
    }

    .consequence {
      background: linear-gradient(180deg, rgba(216, 179, 90, 0.10), rgba(216, 179, 90, 0.06));
      border: 1px solid rgba(216, 179, 90, 0.22);
      padding: 16px 18px;
      border-radius: 16px;
      margin-bottom: 24px;
      color: var(--soft-text);
      font-size: 15px;
      line-height: 1.85;
      position: relative;
      z-index: 1;
    }

    .choices {
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
      z-index: 1;
    }

    .choice {
      background:
        linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
      border: 1px solid var(--line);
      color: var(--text);
      text-align: left;
      padding: 18px 20px;
      border-radius: 16px;
      font-size: 16px;
      line-height: 1.55;
      cursor: pointer;
      transition:
        transform 0.2s ease,
        background 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
    }

    .choice:hover {
      background:
        linear-gradient(180deg, rgba(216, 179, 90, 0.16), rgba(216, 179, 90, 0.09));
      border-color: var(--line-strong);
      transform: translateY(-2px);
      box-shadow: var(--glow);
    }

    .button-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      position: relative;
      z-index: 1;
    }

    .restart {
      background: linear-gradient(90deg, #b88b2d, var(--accent), var(--accent-hover));
      color: #1a1307;
      border: none;
      padding: 14px 28px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, filter 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 8px 24px rgba(216, 179, 90, 0.22);
    }

    .restart:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
      box-shadow: 0 10px 28px rgba(216, 179, 90, 0.30);
    }

    .ending {
      text-align: center;
      padding: 10px 0;
      position: relative;
      z-index: 1;
    }

    .ending p {
      color: var(--muted);
      line-height: 1.85;
      font-size: 17px;
      margin-bottom: 18px;
    }

    .ending.bad-ending {
      background:
        radial-gradient(circle at top, rgba(140, 18, 18, 0.30), transparent 34%),
        linear-gradient(180deg, #120d12, #050507);
      border: 1px solid rgba(214, 70, 70, 0.28);
      box-shadow:
        0 0 30px rgba(150, 0, 0, 0.18),
        inset 0 0 80px rgba(120, 0, 0, 0.10);
      border-radius: 24px;
      padding: 32px 24px;
    }

    .ending.bad-ending .step-label {
      color: #ff7878;
      text-shadow: 0 0 8px rgba(255, 80, 80, 0.28);
    }

    .ending.bad-ending h1 {
      color: #ff5252;
      text-shadow:
        0 0 6px rgba(255, 0, 0, 0.24),
        2px 0 rgba(255, 80, 80, 0.14),
        -2px 0 rgba(120, 0, 0, 0.16);
      animation: badGlitch 2.2s infinite steps(1);
    }

    .ending.bad-ending p {
      color: #efc0c0;
    }

    .ending.bad-ending .restart {
      background: linear-gradient(90deg, #7a1515, #b92e2e);
      color: #fff4f4;
      box-shadow: 0 0 18px rgba(180, 20, 20, 0.22);
    }

    .ending.good-ending {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at top, rgba(255, 239, 180, 0.12), transparent 34%),
        linear-gradient(180deg, rgba(33, 42, 70, 0.98), rgba(15, 19, 35, 0.98));
      border: 1px solid rgba(216, 179, 90, 0.35);
      box-shadow:
        0 12px 36px rgba(0, 0, 0, 0.24),
        inset 0 1px 0 rgba(255,255,255,0.04);
      border-radius: 24px;
      padding: 32px 24px;
    }

    .ending.good-ending::before,
    .ending.good-ending::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .ending.good-ending::before {
      background:
        radial-gradient(circle at 12% 18%, rgba(255,255,255,0.85) 0 2px, transparent 3px),
        radial-gradient(circle at 84% 20%, rgba(255,245,210,0.88) 0 2.5px, transparent 4px),
        radial-gradient(circle at 22% 72%, rgba(255,255,255,0.78) 0 1.8px, transparent 3px),
        radial-gradient(circle at 76% 78%, rgba(255,236,179,0.76) 0 2.2px, transparent 4px),
        radial-gradient(circle at 55% 12%, rgba(255,255,255,0.72) 0 1.6px, transparent 3px);
      opacity: 0.55;
      animation: sparkleTwinkle 3.2s ease-in-out infinite;
    }

    .ending.good-ending::after {
      content: "❦";
      inset: auto;
      right: 18px;
      bottom: 14px;
      position: absolute;
      font-size: 30px;
      color: rgba(216, 179, 90, 0.22);
    }

    .ending.good-ending > * {
      position: relative;
      z-index: 1;
    }

    .ending.good-ending .step-label {
      color: var(--accent);
      text-shadow: 0 0 10px rgba(216, 179, 90, 0.16);
    }

    .ending.good-ending h1 {
      color: #fff9eb;
      text-shadow:
        0 1px 0 rgba(255,255,255,0.10),
        0 0 16px rgba(216, 179, 90, 0.12);
    }

    .ending.good-ending p {
      color: #ebe5d7;
    }

    .bottom-art {
      margin-top: 22px;
      width: 100%;
      border-radius: 22px;
      overflow: hidden;
      border: 1px solid var(--line);
      box-shadow: 0 20px 40px rgba(0,0,0,0.32);
      position: relative;
    }

    .bottom-art::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(216, 179, 90, 0.06), transparent 35%, rgba(0,0,0,0.22));
    }

    .bottom-art img {
      display: block;
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      object-position: center center;
      filter: saturate(0.88) brightness(0.82) contrast(1.05);
    }

    .fade {
      animation: fade 0.45s ease;
    }

    @keyframes fade {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes badGlitch {
      0% { transform: translate(0); opacity: 1; }
      10% { transform: translate(-1px, 0); }
      12% { transform: translate(2px, -1px); }
      14% { transform: translate(0, 0); }
      35% { opacity: 0.96; }
      36% { opacity: 0.82; }
      37% { opacity: 1; }
      62% { transform: translate(1px, 1px); }
      64% { transform: translate(-2px, 0); }
      66% { transform: translate(0, 0); }
      100% { transform: translate(0); opacity: 1; }
    }

    @keyframes sparkleTwinkle {
      0%, 100% { opacity: 0.28; transform: scale(1); }
      50% { opacity: 0.72; transform: scale(1.03); }
    }

    @media (max-width: 700px) {
      body {
        padding: 14px;
      }

      .game {
        padding: 24px;
        border-radius: 20px;
      }

      .choice {
        font-size: 15px;
        padding: 16px;
      }

      .intro-story,
      .consequence {
        padding: 18px;
      }
    }
  </style>
</head>
<body>
<main class="page">
  <section class="game">
    <div class="progress" id="progress"></div>
    <div id="content"></div>

    <div class="bottom-art">
      <img
        src="https://greektraveltellers.com/images/Blog/Apple%20of%20Discord/The_Judgment_of_Paris_by_Claude_Lorrain.jpg"
        alt="The Judgment of Paris painting by Claude Lorrain"
      />
    </div>
  </section>
</main>

<script>
  const TOTAL_STEPS = 5;

  const INTRO_TEXT = `A golden apple rests in your hand.
Before you, stand three beautiful goddesses, each awaiting your judgement.
Moving with regal grace, Hera elegantly demands the prize belongs to her.
Firmly and unshaken, Athena is convinced it is hers by right.
Radiantly, Aphrodite smiles at you, as if the prize is already hers.

"For the Fairest."
Zeus himself has refused to choose. The burden is yours alone.
Power. Wisdom. Love. Each gift stirs a hunger deep within you.

But divine gifts are never simple.
To honor one goddess, is to insult the others.
Judgement awaits, as the fate of Troy unfolds in hands of the Prince.
Choose, Paris, if you dare.`;

  const OPENING_STEP = {
    scenario: "Who receives the Apple of Discord?",
    choices: [
      {
        key: "hera",
        text: "Hera, queen of heaven, offers a crown and power to bring kingdoms to their knees.",

      },
      {
        key: "athena",
        text: "Athena offers wisdom, flawless strategy, unyielding strength, and a warrior’s immortal name.",
        consequence: "You give the apple to Athena. Power floods your limbs like bronze made living, and your thoughts sharpen into battle-sure clarity. Yet Hera's pride smolders, and Aphrodite's wounded silence carries a threat all its own."
      },
      {
        key: "aphrodite",
        text: "Aphrodite promises you the love of the most beautiful woman in the world.",
        consequence: "You place the apple in Aphrodite's hands. Hera and Athena recoil in outrage, but Aphrodite's smile is serene and certain. In that instant, desire overrules caution, and the road to Helen begins to open before you."
      },
      {
        key: "zeus",
        text: "Turn to Zeus and offer the apple back to the king of the gods.",
        consequence: "Zeus throws back his head and laughs, amused by your attempt to escape the judgment. But Hera, Athena, and Aphrodite fix you with such blazing fury that even the thunder seems to retreat. A command rolls through the air: choose again, mortal."
      },
      {
        key: "self",
        text: "Keep the apple for yourself and declare that no one is fairer than you.",
        consequence: "For one reckless heartbeat, silence rules heaven and earth. Then the three goddesses look upon you not with anger alone, but with contempt. To mock divine vanity before Olympus is to invite ruin."
      }
    ]
  };

  const BRANCHES = {
    hera: [
      {
        scenario: "Hera's favor settles over you like a crown. Power gathers around your name, and whispers spread that your bloodline is now marked for kingship. Now that authority rests in your hands, what do you do first?",

          {
            action: "heraFamilyPalace",

          {

          {

      {

          {

          {

      {

          },
          {

  let currentStep = -1;

  let branchStepIndex = 0;

  const content = document.getElementById("content");
  const progress = document.getElementById("progress");

  function getEnding(key) {
    for (const group of Object.values(ENDINGS)) {
      if (group[key]) return group[key];
    }
    return null;
  }

  function buildProgress() {
    progress.innerHTML = "";
    if (currentStep < 0) return;

    for (let i = 0; i < TOTAL_STEPS; i++) {
      const dot = document.createElement("div");
      dot.className = "dot" + (i < currentStep ? " active" : "");
      progress.appendChild(dot);
    }
  }

  function renderIntro() {
    currentStep = -1;
    branchKey = null;
    branchSteps = [];
    branchStepIndex = 0;
    lastSelectedText = "";
    heraFavoritismCount = 0;
    heraPowerFightCount = 0;

    buildProgress();

    content.innerHTML = `
        <div class="fade">
          <div class="step-label">Prologue</div>
          <h1 class="intro-title">The Judgement of Paris</h1>
          <div class="intro-story">${INTRO_TEXT.replace(/\n/g, "<br><br>")}</div>
          <div class="button-row">
            <button class="restart" onclick="startGame()">Begin the Judgment</button>
          </div>
        </div>
      `;
  }

  function startGame() {
    currentStep = 0;
    branchKey = null;
    branchSteps = [];
    branchStepIndex = 0;
    lastSelectedText = "";
    heraFavoritismCount = 0;
    heraPowerFightCount = 0;
    renderOpeningStep();
  }

  function renderOpeningStep() {
    buildProgress();

    let html = `
        <div class="fade">
          <div class="step-label">Decision 1 of ${TOTAL_STEPS}</div>
          <div class="scenario">${OPENING_STEP.scenario}</div>
          <div class="choices">
      `;

    OPENING_STEP.choices.forEach((choice, i) => {
      html += `<button class="choice" onclick="pickOpeningChoice(${i})">${choice.text}</button>`;
    });

    html += `</div></div>`;
    content.innerHTML = html;
  }

  function pickOpeningChoice(index) {
    const choice = OPENING_STEP.choices[index];

    if (choice.key === "self") {
      content.innerHTML = `
          <div class="fade">
            <div class="step-label">Judgment Broken</div>
            <div class="scenario">${choice.text}</div>
            <div class="consequence">${choice.consequence}</div>
            <div class="button-row">
              <button class="restart" onclick="showEnding('selfPunished')">Face the Wrath →</button>
            </div>
          </div>
        `;
      return;
    }

    if (choice.key === "zeus") {
      content.innerHTML = `
          <div class="fade">
            <div class="step-label">Judgment Refused</div>
            <div class="scenario">${choice.text}</div>
            <div class="consequence">${choice.consequence}</div>
            <div class="button-row">
              <button class="restart" onclick="retryOpening()">Choose Again →</button>
            </div>
          </div>
        `;
      return;
    }

    content.innerHTML = `
        <div class="fade">
          <div class="step-label">Decision 1 of ${TOTAL_STEPS}</div>
          <div class="scenario">${choice.text}</div>
          <div class="consequence">${choice.consequence}</div>
          <div class="button-row">
            <button class="restart" onclick="beginBranch('${choice.key}')">Continue →</button>
          </div>
        </div>
      `;
  }

  function retryOpening() {
    currentStep = 0;
    renderOpeningStep();
  }

  function beginBranch(key) {
    branchKey = key;
    branchSteps = BRANCHES[key];
    branchStepIndex = 0;
    currentStep = 1;
    lastSelectedText = "";
    renderBranchStep();
  }

  function renderBranchStep() {
    buildProgress();
    const step = branchSteps[branchStepIndex];

    let html = `
        <div class="fade">
          <div class="step-label">Decision ${currentStep + 1} of ${TOTAL_STEPS}</div>
          <div class="scenario">${step.scenario}</div>
          <div class="choices">
      `;

    step.choices.forEach((choice, i) => {
      html += `<button class="choice" onclick="pickBranchChoice(${i})">${choice.text}</button>`;
    });

    html += `</div></div>`;
    content.innerHTML = html;
  }

  function showChoiceTransition(label, scenario, consequence, nextAction) {
    content.innerHTML = `
        <div class="fade">
          <div class="step-label">${label}</div>
          <div class="scenario">${scenario}</div>
          <div class="consequence">${consequence}</div>
          <div class="button-row">
            <button class="restart" onclick="${nextAction}">Continue →</button>
          </div>
        </div>
      `;
  }

  function pickBranchChoice(index) {
    const step = branchSteps[branchStepIndex];
    const choice = step.choices[index];
    lastSelectedText = choice.text;

    if (choice.action === "heraFamilyFavoritism") {
      heraFavoritismCount++;
      if (heraFavoritismCount >= 2) {
        showChoiceTransition(
          "A House Wounded",
          choice.text,
          "This is the second time you have raised one child above all others. Love has hardened into injustice, and the family you meant to secure now turns inward with resentment and fear.",
          "showEnding('heraAssassinated')"
        );
        return;
      }
    }

    if (choice.action === "heraFamilyPowerFight") {
      heraPowerFightCount++;
      if (heraPowerFightCount >= 2) {
        showChoiceTransition(
          "The House at War",
          choice.text,
          "You have fed rivalry a second time, and now ambition has become something far darker. The contest for succession slips beyond your control, and the house begins destroying itself before Troy's enemies even strike.",
          "showEnding('heraAssassinated')"
        );
        return;
      }
    }

    if (branchKey === "hera" && branchStepIndex === 2 && choice.action === "heraFamilyCompetitionFinal") {
      showChoiceTransition(
        "Justice Secured",
        choice.text,
        "By holding a second fair contest, you finally silence private scheming and make succession a matter of law. The worthiest child is named openly before the house and the city, and for the first time Troy sees a future not built on fear, but on justice.",
        "showEnding('heraThroneDeath')"
      );
      return;
    }

    if (choice.action === "confirmDoubt") {
      content.innerHTML = `
          <div class="fade">
            <div class="step-label">Divine Warning</div>
            <div class="scenario">${choice.text}</div>
            <div class="consequence">${choice.consequence}</div>
            <div class="choices">
              <button class="choice" onclick="resolveDoubt(true)">Yes — I still doubt Helen's beauty.</button>
              <button class="choice" onclick="resolveDoubt(false)">No — I withdraw my doubt.</button>
            </div>
          </div>
        `;
      return;
    }

    if (choice.action === "athenaHelenRoom") {
      showChoiceTransition("Last Invitation", choice.text, choice.consequence, "showEnding('athenaPoisoned')");
      return;
    }

    if (choice.action === "athenaRunAway") {
      showChoiceTransition("Flight", choice.text, choice.consequence, "showEnding('athenaCoward')");
      return;
    }

    if (choice.action === "aphroditeBlame") {
      showChoiceTransition("Blasphemy", choice.text, choice.consequence, "showEnding('aphroditeBlasphemy')");
      return;
    }

    if (choice.action === "aphroditeReturnHelen") {
      showChoiceTransition("Too Late", choice.text, choice.consequence, "showEnding('aphroditeTooLate')");
      return;
    }

    if (choice.action === "heraFamilyPalace" || choice.action === "heraFamilyHeirs") {
      showChoiceTransition("The Royal House", choice.text, choice.consequence, "advanceBranch()");
      return;
    }

    if (choice.action === "heraJusticeRoute") {
      showChoiceTransition("The Weight of the Crown", choice.text, choice.consequence, "showHeraWarQuestions()");
      return;
    }

    if (choice.action === "heraStatueRoute") {
      content.innerHTML = `
          <div class="fade">
            <div class="step-label">Hera's Monument</div>
            <div class="scenario">${choice.text}</div>
            <div class="consequence">${choice.consequence}</div>
            <div class="choices">
              <button class="choice" onclick="pickSpecialHeraFinance('temples')">Pour Troy's wealth into temples and offerings, trusting Hera alone to save the city.</button>
              <button class="choice" onclick="pickSpecialHeraFinance('army')">Use the treasury to train the army and prepare for open war.</button>
              <button class="choice" onclick="pickSpecialHeraFinance('defense')">Use the treasury for food stores, tighter defenses, and protection for civilians.</button>
            </div>
          </div>
        `;
      return;
    }

    if (choice.action === "heraWarRoute") {
      showChoiceTransition("The City Strengthened", choice.text, choice.consequence, "showHeraWarQuestions()");
      return;
    }

    showChoiceTransition(`Decision ${currentStep + 1} of ${TOTAL_STEPS}`, choice.text, choice.consequence, "advanceBranch()");
  }

          </div>
        </div>
      `;
  }

        <div class="fade">
          <div class="step-label">Crisis in Troy</div>
          <div class="scenario">Other kingdoms fear what Troy may become, and word reaches you that spies have entered your government while war approaches. How do you answer threats within your own walls?</div>
          <div class="choices">
            <button class="choice" onclick="resolveHeraWar('tyrant')">Kill any suspicious official and their family before fear can spread further.</button>
            <button class="choice" onclick="resolveHeraWar('watch')">Order your closest adviser to keep watching quietly and draw out the hidden traitors.</button>
            <button class="choice" onclick="resolveHeraWar('trial')">Put every powerful figure under public scrutiny and hold formal trials where needed.</button>
            <button class="choice" onclick="resolveHeraWar('display')">Execute a captured spy before the court so all Troy knows you have no mercy.</button>
          </div>
        </div>
      `;
  }

  function resolveHeraWar(type) {
    if (type === "tyrant" || type === "display") {
      showChoiceTransition(
        "Fear in the Palace",
        "You choose terror as the language of rule.",
        "At first the court falls silent, but silence is not loyalty. By the time the Greeks close in, your own people have begun to hate the hand that rules them.",
        "showEnding('heraRevolt')"
      );
      return;
    }

    showChoiceTransition(
      "A House Under Siege",
      "You resist panic and keep order through patience, judgment, and vigilance.",
      "The fear inside Troy never fully fades, but neither does the people's trust. Now one more judgment stands before you, and it will decide whether you are merely powerful—or truly worthy to rule.",
      "showHeraJusticeQuestion()"
    );
  }

  function showHeraJusticeQuestion() {
    content.innerHTML = `
        <div class="fade">
          <div class="step-label">Judgment in the House</div>
          <div class="scenario">A grave dispute reaches your court: your cousin has wrongfully killed the daughter of an important official after she refused to marry him. The city waits to see whether blood or justice will rule Troy. Who do you side with?</div>
          <div class="choices">
            <button class="choice" onclick="resolveHeraJustice('cousin')">Protect your cousin and shield the royal house from scandal.</button>
            <button class="choice" onclick="resolveHeraJustice('official')">Side with the official, punish your cousin, and prove that no one stands above the law.</button>
          </div>
        </div>
      `;
  }

  function resolveHeraJustice(type) {
    if (type === "cousin") {
      showChoiceTransition(
        "Blood Above Justice",
        "You protect your cousin and place the royal house above the law.",
        "The court learns what this means at once: if power is close enough to you, innocence no longer matters. Fear deepens into hatred, and the people begin to see not a king, but a tyrant in the making.",
        "showEnding('heraRevolt')"
      );
      return;
    }

    showChoiceTransition(
      "Justice Before Blood",
      "You punish your cousin and side with the wronged official.",
      "The city is stunned that you would place justice above kinship, but that shock soon turns to praise. For the first time, many believe that Hera's favor may truly have made you worthy of kingship.",
      "showHeraFinalWarChoice()"
    );
  }

  function showHeraFinalWarChoice() {
    content.innerHTML = `
        <div class="fade">
          <div class="step-label">The Final Hour</div>
          <div class="scenario">War approaches at last, and Troy stands on the edge of destruction. In this final hour, where do you go?</div>
          <div class="choices">
            <button class="choice" onclick="showEnding('heraHonorDeath')">Fight as a frontline warrior and defend your country with your own life.</button>
            <button class="choice" onclick="showEnding('heraBloodlineSaved')">Remain within Troy, cut the royal budget, tighten the defenses, and send your heir away at the last moment to protect the bloodline.</button>
            <button class="choice" onclick="showEnding('heraCowardFlight')">Slip away from Troy as things grow worse and try to save yourself before the walls fall.</button>
            <button class="choice" onclick="showEnding('heraSlaveKing')">Offer up Troy's women and condemn innocent citizens to slavery if it means you may keep the crown.</button>
            <button class="choice" onclick="showEnding('heraJustKing')">Remain in the city as a just king, keeping order among the people and refusing both panic and cruelty as Troy meets its fate.</button>
          </div>
        </div>
      `;
  }

  function advanceBranch() {
    branchStepIndex++;
    currentStep++;

    if (branchStepIndex >= branchSteps.length) {
      resolveBranchEnding();
    } else {
      renderBranchStep();
    }
  }

  function resolveBranchEnding() {
    if (branchKey === "hera") {
      if (lastSelectedText === "Stand with your household, keeping the family united as you fight to shield heirs and civilians.") {
        showEnding("heraUnitedHouse");
        return;
      }

      if (lastSelectedText === "Choose the child who proved worthy in fair contest, then die protecting the heir who will carry your bloodline onward.") {
        showEnding("heraCompetitionVictory");
        return;
      }

      if (lastSelectedText === "Entrust everything to your favorite child and cast the rest of the family aside.") {
        showEnding("heraAssassinated");
        return;
      }

      if (lastSelectedText === "Try to command a divided household in the middle of war, even after teaching it to struggle for power.") {
        showEnding("heraAssassinated");
        return;
      }

      if (lastSelectedText === "Refuse to name a successor even now, believing the crown must remain undivided until you die.") {
        showEnding("heraNoHeir");
        return;
      }

      showEnding("heraUnitedHouse");
      return;
    }

    if (branchKey === "athena") {
      if (
        lastSelectedText === "Stand before the walls and die as Troy's last and greatest defender." ||
        lastSelectedText === "Accept that your legend and Troy's death will become one story forever."
      ) {
        showEnding("athenaHonor");
        return;
      }

      if (lastSelectedText === "Pray at last for wisdom enough to understand what all this strength was for.") {
        showEnding("athenaFulfillment");
        return;
      }

      showEnding("athenaDefault");
      return;
    }

    if (branchKey === "aphrodite") {
      if (
        lastSelectedText === "Helen, whatever the cost, nothing matters as long as you have Helen." ||
        lastSelectedText === "Pray that love may still mean something, even if it cannot save the city."
      ) {
        showEnding("aphroditeLove");
        return;
      }

      if (lastSelectedText === "Honor—face what you have done and die defending the city you helped doom.") {
        showEnding("aphroditeFulfillment");
        return;
      }

      showEnding("aphroditeDefault");
    }
  }

  function showEnding(key) {
    buildProgress();
    const ending = getEnding(key);

    if (!ending) {
      content.innerHTML = `
          <div class="fade">
            <div class="step-label">Error</div>
            <div class="scenario">Ending not found: ${key}</div>
            <div class="button-row">
              <button class="restart" onclick="renderIntro()">Restart</button>
            </div>
          </div>
        `;
      return;
    }

    let stateClass = "";
    if (ending.bad === true) stateClass = " bad-ending";
    if (ending.good === true) stateClass = " good-ending";

    content.innerHTML = `
        <div class="ending${stateClass} fade">
          <div class="step-label">Fate Decided</div>
          <h1>${ending.title}</h1>
          <p>${ending.text}</p>
          <button class="restart" onclick="renderIntro()">Play Again</button>
        </div>
      `;
  }

  renderIntro();
</script>
</body>
</html>
